<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wander Armenia">
  <!--
    Drawn as paths rather than text: an SVG favicon has no guaranteed font, so
    lettering renders differently (or not at all) depending on the platform.
    A map pin over a mountain ridge says "places" without needing type.
  -->
  <rect width="64" height="64" rx="14" fill="#4f46e5" />

  <!-- Ridge line along the bottom third -->
  <path
    d="M8 47 L22 31 L31 41 L42 27 L56 47 Z"
    fill="#ffffff"
    fill-opacity="0.28"
  />

  <!-- Location pin -->
  <path
    d="M32 12c-6.1 0-11 4.9-11 11 0 8.2 11 19 11 19s11-10.8 11-19c0-6.1-4.9-11-11-11z"
    fill="#ffffff"
  />
  <circle cx="32" cy="23" r="4.2" fill="#4f46e5" />
</svg>
